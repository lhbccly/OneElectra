<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>One Electra</title>
  <!-- Concept F — Plug-E + O ring: eye-catching EV hardware mark -->
  <circle cx="32" cy="32" r="28" stroke="#18201F" stroke-width="3.5" fill="#FFFFFF"/>
  <!-- E spine -->
  <rect x="18" y="16" width="7" height="32" rx="1.5" fill="#18201F"/>
  <!-- E top / bottom arms -->
  <rect x="25" y="16" width="18" height="6" rx="1.5" fill="#18201F"/>
  <rect x="25" y="42" width="18" height="6" rx="1.5" fill="#18201F"/>
  <!-- Lime charge arm + connector tip -->
  <rect x="25" y="29" width="16" height="6" rx="1.5" fill="#84CC16"/>
  <rect x="40" y="28.25" width="7.5" height="7.5" rx="2.5" fill="#84CC16"/>
  <circle cx="45.2" cy="30.4" r="1.15" fill="#18201F"/>
  <circle cx="45.2" cy="33.6" r="1.15" fill="#18201F"/>
</svg>
